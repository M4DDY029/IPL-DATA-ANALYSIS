name: Refresh IPL data from Cricsheet

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Cricsheet and rebuild dashboard data
        run: python scripts/update_cricsheet_dashboard.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "clean data/ipl_dashboard_pro.html" data models
          if git diff --cached --quiet; then
            echo "Cricsheet data is already current."
          else
            git commit -m "Refresh IPL data from Cricsheet"
            git push
          fi